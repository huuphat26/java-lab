spring:
  application:
    name: booking-spring-app

  # H2 Database — chạy thử không cần cài DB thật
  datasource:
    url: jdbc:h2:mem:bookingdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # H2 Console — truy cập tại http://localhost:8080/h2-console
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080
